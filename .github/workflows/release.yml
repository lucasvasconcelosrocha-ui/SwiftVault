name: Release SwiftVault

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Extract Tag & Version Info
        id: version_info
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          
          # Extrai versionCode e versionName do app/build.gradle.kts
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n1 | awk '{print $3}')
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "Building SwiftVault ${TAG_NAME} (versionCode: ${VERSION_CODE}, versionName: ${VERSION_NAME})"

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "Primeira release detectada. Gerando histórico completo de commits."
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" "$TAG_NAME")
          else
            echo "Commits desde a tag ${PREV_TAG}:"
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" "${PREV_TAG}..${TAG_NAME}")
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* Atualização e melhorias do SwiftVault ${TAG_NAME}"
          fi
          
          echo "$CHANGELOG" > release_notes.md
          cat release_notes.md

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/swiftvault-release.jks

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: /tmp/swiftvault-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Prepare Artifacts & Checksums
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Erro: APK de release não foi gerado em $APK_SRC"
            exit 1
          fi
          
          APK_DEST="SwiftVault-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          # Calcula SHA-256 e gera arquivo .sha256 com hash puro
          SHA256_HASH=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "$SHA256_HASH" > "${APK_DEST}.sha256"
          
          APK_SIZE=$(stat -c%s "$APK_DEST")
          
          echo "SHA256: $SHA256_HASH"
          echo "Size: $APK_SIZE bytes"
          
          # Gera o version.json estruturado
          jq -n \
            --arg vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg tag "$TAG_NAME" \
            --arg name "$APK_DEST" \
            --arg size "$APK_SIZE" \
            --arg sha "$SHA256_HASH" \
            --arg notes "$(<release_notes.md)" \
            '{
              versionCode: ($vc | tonumber),
              versionName: $vn,
              tag: $tag,
              apkName: $name,
              apkSize: ($size | tonumber),
              sha256: $sha,
              releaseNotes: $notes
            }' > version.json
            
          echo "=== version.json ==="
          cat version.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            "SwiftVault-${TAG_NAME}.apk" \
            "SwiftVault-${TAG_NAME}.apk.sha256" \
            "version.json" \
            --title "SwiftVault ${TAG_NAME}" \
            --notes-file release_notes.md

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f /tmp/swiftvault-release.jks
